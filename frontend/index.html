<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      No static <meta name="description">/og:* here on purpose: react-helmet-async
      (see components/Seo.tsx) renders those per page, and it can only override tags
      it rendered itself — a static tag with the same name/property would sit ahead
      of Helmet's in document order and win with crawlers that read first-match.
      AppLayout renders a site-wide default Seo, so every route still gets a value.
    -->
    <meta name="google-site-verification" content="%VITE_GOOGLE_SITE_VERIFICATION%" />
    <meta name="yandex-verification" content="%VITE_YANDEX_VERIFICATION%" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap"
    />
    <title>Teenage Space</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
